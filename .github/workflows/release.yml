name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Flatpak and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak file desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Sdk//50 org.gnome.Platform//50

      - name: Build AppImage
        run: |
          flatpak run \
            --filesystem="$PWD" \
            --filesystem=/tmp \
            --share=network \
            --env=CARGO_HOME="$PWD/.cargo-home" \
            --env=RUSTUP_HOME="$PWD/.rustup-home" \
            --env=WORKDIR="$PWD" \
            --command=bash org.gnome.Sdk//50 \
            -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path && . "$CARGO_HOME/env" && cd "$WORKDIR" && ./build-appimage.sh'

      - name: Assemble release assets
        run: |
          cp build-appimage/PintRust-x86_64.AppImage .
          cat > com.lurim412.PintRust.flatpakref <<'EOF'
          [Flatpak Ref]
          Title=PintRust
          Name=com.lurim412.PintRust
          Branch=master
          Url=https://lurima12.github.io/pintrust/repo/
          SuggestRemoteName=pintrust
          RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          EOF
          sha256sum \
            PintRust-x86_64.AppImage \
            com.lurim412.PintRust.flatpakref > SHA256SUMS
          cat > release-notes.md <<'EOF'
          A lightweight, native Pinterest client for GNOME, built with Rust,
          GTK4, libadwaita and WebKitGTK 6.0.

          ### Install with Flatpak

          ```sh
          flatpak install --user https://lurima12.github.io/pintrust/com.lurim412.PintRust.flatpakref
          flatpak run com.lurim412.PintRust
          ```

          ### Run the AppImage

          ```sh
          chmod +x PintRust-x86_64.AppImage
          ./PintRust-x86_64.AppImage
          ```

          The Flatpak repository is hosted on GitHub Pages. It requires
          `org.gnome.Platform//50`. The AppImage requires `bwrap` and a
          `/var/tmp` that allows executing files.

          PintRust is an unofficial client and is not affiliated with or
          endorsed by Pinterest, Inc.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              PintRust-x86_64.AppImage \
              com.lurim412.PintRust.flatpakref \
              SHA256SUMS
          else
            gh release create "$TAG" \
              --title "PintRust ${TAG#v}" \
              --notes-file release-notes.md \
              PintRust-x86_64.AppImage \
              com.lurim412.PintRust.flatpakref \
              SHA256SUMS
          fi
